[workspace]
resolver = "2"
members = [
    "crates/drm-core",
    "crates/drm-exec",
    "crates/drm-observe",
    "crates/drm-opt",
    "crates/drmd",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/LukeCampbell3/drm-linux-kernel-coder"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
