name: Product baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Capture frozen and machine baseline
        run: scripts/product-baseline.sh results/product-baseline
      - uses: actions/upload-artifact@v4
        with:
          name: product-baseline-${{ github.sha }}
          path: results/product-baseline
          if-no-files-found: error
